name: AETCG Core Platform Automation Quality Control

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify_build_quality_metrics:
    runs-on: ubuntu-latest

    # The scenario suite exercises the real queue and worker against Redis.
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    steps:
    - name: Checkout Code Repository State
      uses: actions/checkout@v5

    - name: Instantiate Python Execution Environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Resolve Core Application Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Automated Supply Chain Security Scanning Metrics
      run: |
        pip-audit

    - name: Execute Unit Test Protocols and Quality Assertions
      run: |
        pytest tests/

    - name: Scenario scorecard (before/after yardstick)
      run: |
        python scripts/scenario_suite.py